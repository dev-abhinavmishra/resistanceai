# Streamlit configuration for ResistanceAI.
# Theme tokens mirror app.py's design system (see DESIGN.md) so native
# widgets and custom HTML share one palette — also used by Streamlit
# Community Cloud deployments.

[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f1f5f9"
font = "sans serif"

# Sidebar inherits base="dark" defaults that clash with the token palette;
# pin it to the same surface/border tokens the app stylesheet uses.
[theme.sidebar]
backgroundColor = "#1e293b"
secondaryBackgroundColor = "#141f36"
textColor = "#f1f5f9"
primaryColor = "#3b82f6"
borderColor = "#2b3a52"
showWidgetBorder = true
baseRadius = "small"
buttonRadius = "small"

[server]
headless = true
# Runtime ledger writes (audit_log.json, case_archive.json, ...) land under
# backend/artifacts/ — inside the watched app dir — so every prediction would
# otherwise raise the "File changed / Rerun" banner mid-demo. Hot-reload is
# a dev convenience; disable watching for the shipped app (Streamlit Cloud
# doesn't watch anyway). Re-enable locally if you want run-on-save.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
