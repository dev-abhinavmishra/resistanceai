# Streamlit configuration for ResistanceAI.
# Dark theme matching the app's oncology-console palette; also used by
# Streamlit Community Cloud deployments.

[theme]
base = "dark"
primaryColor = "#10b981"
backgroundColor = "#1a192b"
secondaryBackgroundColor = "#242136"
textColor = "#f5f7fc"

[server]
headless = true

[browser]
gatherUsageStats = false
